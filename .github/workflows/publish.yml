name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          package_version="$(python - <<'PY'
          from zer0lint import __version__
          print(__version__)
          PY
          )"
          test "$RELEASE_TAG" = "v$version"
          test "$package_version" = "$version"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify artifacts and clean wheel install
        run: |
          python -m pip install --upgrade twine
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          wheel="dist/zer0lint-${version}-py3-none-any.whl"
          test -f "$wheel"
          test -f "dist/zer0lint-${version}.tar.gz"
          python -m twine check dist/*
          python -m venv /tmp/zer0lint-wheel
          /tmp/zer0lint-wheel/bin/python -m pip install "$wheel"
          /tmp/zer0lint-wheel/bin/zer0lint --version
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
